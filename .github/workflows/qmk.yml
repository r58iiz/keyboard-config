name: QMK & Keymaps CI

on:
  push:
    branches: [ main ]
    paths:
      - docker/**
      - keyboards/**
      - overlays/**
      - users/**
      - keymaps.json
      - .github/workflows/qmk.yml
      - .github/workflows/docker.yml

concurrency:
  group: qmk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # required to check out the repository

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - 'docker/**'
              - '.github/workflows/docker.yml'

  build-container:
    name: Build container (if needed)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read # checkout only
      packages: write # push the built image to GHCR

  firmware-keymap:
    name: Build firmware & render keymaps
    needs: [changes, build-container]
    if: |
      always() &&
      (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases and push keymap asset updates
      packages: read # to pull the builder image from GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: image
        run: |
          if [ "${NEEDS_CHANGES_OUTPUTS_DOCKER}" = "true" ]; then
            echo "tag=${NEEDS_BUILD_CONTAINER_OUTPUTS_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/${REPO}/qmk-builder:latest" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_DOCKER: ${{ needs.changes.outputs.docker }}
          NEEDS_BUILD_CONTAINER_OUTPUTS_IMAGE_TAG: ${{ needs.build-container.outputs.image_tag }}
          REPO: ${{ github.repository }}

      - name: Pull container
        run: docker pull "${STEPS_IMAGE_OUTPUTS_TAG}"
        env:
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}

      - name: Build & Render
        run: |
          docker run --rm \
            -v "${WORKSPACE}/out:/out" \
            -v "${WORKSPACE}:/local-qmk" \
            "${STEPS_IMAGE_OUTPUTS_TAG}" \
            bash -c 'qmk-sync && build-all-firmware.py && draw-keymaps.py --output /local-qmk/assets/keymaps'
        env:
          WORKSPACE: ${{ github.workspace }}
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}

      - name: Publish Firmware Release Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: firmware-${{ github.sha }}
          name: "Firmware Build ${{ github.run_number }} (${{ github.sha }})"
          body: "Automated QMK & Vial firmware binaries compiled from main."
          make_latest: true
          files: |
            out/*.uf2
            keyboards/**/keymaps/**/*.vil

      - name: Prune old firmware releases (keep last 10)
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | grep '^firmware-' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated keymap SVGs & converted Vial keymaps
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "ci(assets): auto-update keymap SVGs and Vial conversion"
          file_pattern: |
            assets/keymaps/*.svg
            keyboards/**/keymaps/**/*_vial/*.vil
            keyboards/**/keymaps/**/*_vial/keymap.c
            keyboards/**/keymaps/**/*_vial/keymap.h
