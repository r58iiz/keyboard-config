name: Docker Builder Image

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Full image ref that was built/pushed"
        value: ${{ jobs.build-container.outputs.image_tag }}

permissions:
  contents: read # required to check out the repository

jobs:
  build-container:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      packages: write # push the built image to GHCR
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "image_tag=ghcr.io/${REPO}/qmk-builder:${SHA}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker
          file: ./docker/qmk.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/qmk-builder:latest
            ${{ steps.tags.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
