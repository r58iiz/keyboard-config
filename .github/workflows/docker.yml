name: Docker Builder Image

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Full image ref that was built/pushed"
        value: ${{ jobs.build-container.outputs.image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "image_tag=ghcr.io/${{ github.repository }}/qmk-builder:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/qmk.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/qmk-builder:latest
            ${{ steps.tags.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
